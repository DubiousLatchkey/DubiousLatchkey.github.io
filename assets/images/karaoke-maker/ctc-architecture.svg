    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #eef3fa" transform="translate(710.2368 167.564681)">Hidden size 768 · 12 heads</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #eef3fa" transform="translate(710.2368 183.225587)">Frozen base weights</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #eef3fa" transform="translate(710.2368 198.886494)">Trainable LoRA on Q and V</text>
   </g>
