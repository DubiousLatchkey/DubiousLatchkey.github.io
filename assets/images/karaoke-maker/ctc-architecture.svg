   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #65ddc6" x="72.7776" y="137.991412" transform="rotate(-0 72.7776 137.991412)">01  Vocal audio</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #eef3fa" transform="translate(72.7776 167.564681)">Mono, resampled to 16 kHz</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #eef3fa" transform="translate(72.7776 183.225587)">Approximate lyric-line window</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #eef3fa" transform="translate(72.7776 198.886494)">Up to 0.5 s context on each side</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #92baff" x="391.5072" y="137.991412" transform="rotate(-0 391.5072 137.991412)">02  Acoustic features</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #eef3fa" transform="translate(391.5072 167.564681)">7 convolutional layers</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #eef3fa" transform="translate(391.5072 183.225587)">512 channels per layer</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #eef3fa" transform="translate(391.5072 198.886494)">Feature projection: 512 → 768</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffd06a" x="710.2368" y="137.991412" transform="rotate(-0 710.2368 137.991412)">03  Transformer × 12</text>
   </g>
